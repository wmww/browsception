<!doctype html>
<!-- bench fixture (diagnostic): image-scroll — the decode/upload path alone.
     APPEND-ONLY (see text-scroll.html). Dense grid of distinct inline
     data-URI images (deterministic, no network); same left-gutter ruler. -->
<html><head><meta charset="utf-8"><title>BENCH-IMAGE-SCROLL</title>
<style>
  html, body { margin: 0; background: #fff; font: 13px/1.3 system-ui, sans-serif; }
  #ruler { position: absolute; left: 0; top: 0; width: 10px; }
  #ruler div { width: 10px; height: 120px; }
  #doc { margin-left: 14px; display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; }
  img { width: 200px; height: 130px; display: block; }
</style></head>
<body>
<div id="ruler"></div>
<div id="doc"></div>
<script>
  const img = (i) => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="130">'
    + '<defs><radialGradient id="g"><stop offset="0" stop-color="hsl(' + (i * 31 % 360) + ',80%,80%)"/>'
    + '<stop offset="1" stop-color="hsl(' + ((i * 31 + 90) % 360) + ',80%,35%)"/></radialGradient></defs>'
    + '<rect width="200" height="130" fill="url(#g)"/>'
    + '<path d="M0,' + (20 + i % 60) + ' L200,' + (110 - i % 60) + ' L200,130 L0,130 Z" fill="rgba(0,0,0,.25)"/>'
    + '<text x="8" y="24" font-size="16" fill="#fff">img ' + i + '</text></svg>');
  let html = '';
  for (let i = 0; i < 900; i++) html += '<img src="' + img(i) + '" alt="">';
  document.getElementById('doc').innerHTML = html;
  const H = document.documentElement.scrollHeight;
  let ruler = '';
  for (let i = 0; i * 120 < H; i++)
    ruler += '<div style="background:rgb(' + (i & 255) + ',' + ((i >> 8) & 255) + ',128)"></div>';
  document.getElementById('ruler').innerHTML = ruler;
  document.title = 'BENCH-IMAGE-SCROLL ' + H;
</script>
</body></html>
