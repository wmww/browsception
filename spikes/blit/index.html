<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Browsception spike 0.4 — blit + input harness</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd;
               font: 13px/1.4 monospace; }
  body { display: flex; flex-direction: column; }
  #bar { padding: 6px 10px; display: flex; gap: 12px; align-items: center;
         background: #1c1c1c; }
  #bar select { font: inherit; background: #333; color: #ddd; border: 1px solid #555; }
  #view { flex: 1; position: relative; min-height: 0; }
  #view canvas { width: 100%; height: 100%; display: block; outline: none; }
  #hud { position: absolute; top: 8px; right: 8px; padding: 8px 10px;
         background: rgba(0,0,0,.65); white-space: pre; pointer-events: none;
         border-radius: 4px; }
</style>
</head>
<body>
<div id="bar">
  <label>res <select id="sel-res"><option value="1080">1920x1080</option><option value="1440">2560x1440</option></select></label>
  <label>path <select id="sel-path"><option value="webgl2">webgl2</option><option value="2d">2d putImageData</option></select></label>
  <label>mode <select id="sel-mode"><option value="full">full frame</option><option value="dirty">dirty rows (~10%)</option></select></label>
  <span>click canvas for keyboard focus</span>
</div>
<div id="view"><div id="hud">starting…</div></div>
<script type="module" src="./js/viewer.js"></script>
</body>
</html>
