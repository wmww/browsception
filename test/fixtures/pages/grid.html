<!doctype html>
<!-- grid.bstest — pixel-probe fixture. Pure-color 100x100 squares at fixed
     viewport coordinates; probe centers: (100,100) (300,100) (100,300)
     (300,300) (500,100). No fonts influence geometry (text lives below y=500). -->
<html>
<head>
  <meta charset="utf-8">
  <title>BSTEST-GRID</title>
  <style>
    html, body { margin: 0; background: #ffffff; }
    div { position: fixed; width: 100px; height: 100px; }
    #r { left: 50px;  top: 50px;  background: #ff0000; }
    #g { left: 250px; top: 50px;  background: #00ff00; }
    #b { left: 50px;  top: 250px; background: #0000ff; }
    #y { left: 250px; top: 250px; background: #ffff00; }
    #k { left: 450px; top: 50px;  background: #000000; }
    p  { position: fixed; top: 520px; left: 50px; }
  </style>
</head>
<body>
  <div id="r"></div><div id="g"></div><div id="b"></div><div id="y"></div><div id="k"></div>
  <p>BSTEST-GRID-SENTINEL</p>
</body>
</html>
