<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>scroll fixture</title>
<style>
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #fff; color: #111; }
  /* Each section carries a 10px colour-coded left border encoding its index,
     so a pixel probe at x=4 reads back the engine's scroll offset. */
  section { height: 120px; box-sizing: border-box; padding: 6px 12px; overflow: hidden;
            border-left: 10px solid #000; }
  p { margin: 0 0 3px 0; }
  /* ?frame=1: a 300x300 same-origin subframe, its own root overscroll-behavior
     contained, over the main frame's sections (which keep probing at x=4). */
  iframe { position: absolute; left: 200px; top: 0; width: 300px; height: 300px; border: 0; }
</style></head>
<body><div id="w"></div>
<script>
  // ?ob=<value> sets the ROOT element's overscroll-behavior (the value the main
  // frame's wheel path reads); ?inner=1 is the subframe document (short, so a
  // burst overscrolls past its end); ?frame=1 embeds it. The server ignores the
  // query — every variant is the same page.
  const q = new URLSearchParams(location.search);
  const inner = q.has('inner');
  if (q.has('ob')) document.documentElement.style.overscrollBehavior = q.get('ob');
  const N = inner ? 10 : 4000, H = 120;
  const words = ('lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor '
    + 'incididunt ut labore et dolore magna aliqua enim ad minim veniam quis nostrud').split(' ');
  let html = '';
  for (let i = 0; i < N; i++) {
    const c = 'rgb(' + (i & 255) + ',' + ((i >> 8) & 255) + ',128)';
    let text = '';
    for (let l = 0; l < 3; l++) {
      let line = '';
      for (let k = 0; k < 14; k++) line += words[(i * 7 + l * 3 + k) % words.length] + ' ';
      text += '<p>' + i + ': ' + line + '</p>';
    }
    html += '<section style="border-left-color:' + c + '">' + text + '</section>';
  }
  document.getElementById('w').innerHTML = html;
  if (q.has('frame')) {
    const f = document.createElement('iframe');
    f.src = '/?inner=1&ob=contain';
    document.body.appendChild(f);
  }
  document.title = 'scroll fixture ' + N * H;
</script>
</body></html>
