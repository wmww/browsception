<!doctype html>
<!-- bench fixture (diagnostic): paint-heavy-scroll — Skia raster worst case.
     APPEND-ONLY (see text-scroll.html). Cards with large blurred shadows,
     gradients, rounded corners and a blur filter; same left-gutter ruler. -->
<html><head><meta charset="utf-8"><title>BENCH-PAINT-HEAVY</title>
<style>
  html, body { margin: 0; background: #eef1f6; font: 14px/1.4 system-ui, sans-serif; }
  #ruler { position: absolute; left: 0; top: 0; width: 10px; }
  #ruler div { width: 10px; height: 120px; }
  #doc { margin-left: 14px; display: flex; flex-wrap: wrap; gap: 14px; padding: 14px; }
  .card { width: 260px; height: 150px; border-radius: 14px; padding: 10px; box-sizing: border-box;
          box-shadow: 0 10px 28px rgba(25, 35, 60, .30), 0 2px 6px rgba(25, 35, 60, .22);
          border: 1px solid rgba(255,255,255,.7); }
  .card .glow { width: 60px; height: 60px; border-radius: 50%; filter: blur(9px); opacity: .8; }
</style></head>
<body>
<div id="ruler"></div>
<div id="doc"></div>
<script>
  let html = '';
  for (let i = 0; i < 900; i++) {
    const hue = (i * 23) % 360;
    html += '<div class="card" style="background:linear-gradient(135deg,hsl(' + hue
      + ',70%,88%),hsl(' + ((hue + 40) % 360) + ',70%,62%))">'
      + '<div class="glow" style="background:hsl(' + ((hue + 180) % 360) + ',90%,55%)"></div>'
      + 'card ' + i + '</div>';
  }
  document.getElementById('doc').innerHTML = html;
  const H = document.documentElement.scrollHeight;
  let ruler = '';
  for (let i = 0; i * 120 < H; i++)
    ruler += '<div style="background:rgb(' + (i & 255) + ',' + ((i >> 8) & 255) + ',128)"></div>';
  document.getElementById('ruler').innerHTML = ruler;
  document.title = 'BENCH-PAINT-HEAVY ' + H;
</script>
</body></html>
